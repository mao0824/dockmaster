name: nas-nav
services:
  nas-nav:
    image: python:3.12-alpine
    container_name: 13002-nas-nav
    hostname: 13002-nas-nav
    restart: unless-stopped
    network_mode: host
    volumes:
      - /volume1/docker/nas-nav:/app
    working_dir: /app
    command: python3 -u app.py
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:13002/api/status',timeout=5)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
